services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_SECRET_KEY: ${APP_SECRET_KEY:-replace_me_dev_only}
      DATABASE_URL: sqlite:////data/mal_assistant.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      MAL_CLIENT_SECRET: ${MAL_CLIENT_SECRET:-}
      MAL_REDIRECT_URI: ${MAL_REDIRECT_URI:-http://localhost:8000/auth/mal/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      OAUTH_STATE_EXPIRATION_MINUTES: ${OAUTH_STATE_EXPIRATION_MINUTES:-10}
      TOKEN_REFRESH_SKEW_SECONDS: ${TOKEN_REFRESH_SKEW_SECONDS:-60}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-15}
    volumes:
      - mal_assistant_data:/data

volumes:
  mal_assistant_data:
